# written by roottweak: the UI scale this image was made for (2 or 3)
scale=3
# The Galaxy S25 Ultra's sessions (OneiOS docs/SM8750_PORT.md, 2026-11-19), what the hand-made switch script of the
# phone's sessions 1 and 2 passed on xnuhost's command line, now that the fork's oneios_switch.sh starts xnuhost:
# the guest's mode (the helper scales it to the 1440x3120 panel; 2.53 instead of 4.49 megapixels a frame to render,
# copy and post at 120 Hz) and Wi-Fi as the stand-in (the phone's Wi-Fi bridge is not yet tried on this phone).
width=1080
height=2340
hz=120
wifi=sim
# What ram=auto counts beside the guest for the kernel's share of the iOS tasks: their page tables and, measured in
# session 5 with a 6144 MiB guest, their mappings too: 610 MiB of page tables and 2.8 million mappings (vm_area_struct,
# vma_lock, maple_node: 810 MiB of slab), 23 % of the guest. With 16 % the host had MemAvailable near 950 MiB and
# Samsung's swappiness swapped its daemons at 120 MB/s each way. 28 % gives 5632 MiB for MemAvailable 8.3-8.6 GiB.
ram-pagetable-percent=28
