name: SM8850 port CI
on:
  push:
    branches: ['feat/oneios-sm8850-m3q']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm8850-oneios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridges:
    name: Host bridge regression tests (SM8850)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate changes
        run: |
          git diff --check
          bash -n runtime/bridges/tests/host.sh
      - name: Compile and test host bridges
        run: make -C runtime/bridges test

  xnuhost-input:
    name: SM8850 touch and S Pen host regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build xnuhost unit tests with ASan and UBSan
        run: make -C runtime/xnuhost build/host/test_xnuhost
      - name: Test internal touch priority and S Pen hover event alias
        working-directory: runtime/xnuhost
        run: ASAN_OPTIONS=detect_leaks=0 build/host/test_xnuhost
