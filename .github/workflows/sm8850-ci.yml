# Trusted pushes only: this public repository must not run untrusted pull_request code on a personal PC.
# Register a Linux x64 self-hosted runner with the label oneios-cachyos.
# The job never invokes adb, su, or phone-switch commands.
name: SM8850 local CI
on:
  push:
    branches: ['feat/oneios-sm8850-m3q']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm8850-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: CachyOS host regression and ARM64 package
    runs-on: [self-hosted, linux, x64, oneios-cachyos]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local CI (no adb or root)
        run: scripts/ci-local.sh all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oneios-runtime
          path: |
            out/release/*.tar.zst
            out/release/*.sha256
            out/release/*.runtime.json
          if-no-files-found: error
          retention-days: 14
